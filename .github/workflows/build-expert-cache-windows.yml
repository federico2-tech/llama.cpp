name: Build expert cache Windows CUDA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout expert-cache branch
        uses: actions/checkout@v6
        with:
          repository: memoriaru/llama.cpp
          ref: moe-expert-pool
          fetch-depth: 1

      - name: Install CUDA 12.4
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '12.4'
          cuda_arch: x64

      - name: Install Ninja
        shell: powershell
        run: choco install ninja -y

      - name: Configure and build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" -DGGML_CUDA=ON -DGGML_NATIVE=OFF -DGGML_CUDA_CUB_3DOT2=ON
          cmake --build build --config Release -j 15 --target llama-server llama-cli llama-bench test-expert-pool

      - name: Package
        shell: powershell
        run: |
          Compress-Archive -Path build\bin\Release\* -DestinationPath llama-cpp-expert-cache-win-cuda124.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-expert-cache-win-cuda124
          path: llama-cpp-expert-cache-win-cuda124.zip
          retention-days: 7
